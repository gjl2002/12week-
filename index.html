<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>12-Week Stacked Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- 公共变量 --- */
            --accent-color: #ff2d55;
            --accent-rgb: 255, 45, 85;
            
            --bg-page: transparent;
            --bg-card: rgba(255, 255, 255, 0.94);
            --bg-card-hover: rgba(255, 255, 255, 1);
            --border-card: rgba(0, 0, 0, 0.06);
            --glass-blur: blur(24px);
            
            --text-main: #1f2937;
            --text-muted: #8e8e93;
            --text-dim: #e5e7eb;
            --track-bg: rgba(0, 0, 0, 0.04);
            
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.05);
            --modal-bg: #ffffff;
            --modal-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            
            /* [修改] 调亮当前行的背景色浓度，使其更明显 */
            --current-row-bg: rgba(var(--accent-rgb), 0.12);
            --w13-bg: rgba(var(--accent-rgb), 0.03);
            
            /* 紧凑变量 */
            --gap: 8px;
            --radius: 20px;
            --pad: 16px;
        }

        :root[data-theme="dark"] {
            --bg-card: rgba(30, 30, 32, 0.88);
            --bg-card-hover: rgba(44, 44, 46, 0.96);
            --border-card: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --text-dim: #3f3f46;
            --track-bg: rgba(255, 255, 255, 0.15);
            --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.4);
            --modal-bg: #1c1c1e;
            --current-row-bg: rgba(var(--accent-rgb), 0.25);
            --w13-bg: rgba(var(--accent-rgb), 0.08);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-page);
            font-family: "SF Pro Text", "Inter", sans-serif;
            color: var(--text-main);
            padding: 10px; overflow-x: hidden;
            transition: background 0.3s ease;
        }

        .widget-container { 
            width: 100%; max-width: 500px;
            display: flex; flex-direction: column; gap: 10px; /* 进一步减小容器间距 */
            transition: max-width 0.3s ease;
        }

        .icon-svg {
            width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; display: block;
        }

        /* --- Dashboard --- */
        .bento-grid {
            display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: auto auto; gap: var(--gap);
            transition: all 0.4s ease;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            padding: var(--pad);
            box-shadow: var(--shadow-card);
            transition: transform 0.2s ease, background 0.3s ease;
            position: relative;
            display: flex; flex-direction: column;
            overflow: visible; 
            min-width: 0;
        }
        .card:hover { transform: translateY(-1px); background: var(--bg-card-hover); }

        /* One time overview: date, 12-week progress, year and week metrics */
        .time-overview-card { gap: 12px; padding: 14px; }
        .overview-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
        .overview-date-time { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: 1; min-width: 0; width: auto; }
        .overview-title { font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
        .overview-tools { display: flex; align-items: center; gap: 6px; flex-shrink: 0; position: relative; }
        .overview-tools .dash-ctrls { position: static; opacity: 0; }
        .time-overview-card:hover .overview-tools .dash-ctrls,
        .overview-tools:hover .dash-ctrls { opacity: 1; }
        .overview-tools .btn-display { opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .time-overview-card:hover .overview-tools .btn-display,
        .overview-tools .btn-display:focus-visible { opacity: 1; pointer-events: auto; }

        .overview-primary {
            background: var(--accent-color); color: #fff; border-radius: 16px;
            padding: 14px 16px; min-width: 0;
        }
        .overview-primary-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
        .overview-primary-info { min-width: 0; }
        .overview-primary-info .card__label { white-space: normal; line-height: 1.2; }
        .overview-primary .card__label { color: rgba(255,255,255,0.82); }
        .overview-primary .main-stat { font-size: clamp(16px, 4vw, 22px); font-weight: 700; white-space: nowrap; }
        .overview-primary .hero-bar { margin-top: 9px; }
        .overview-secondary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); min-width: 0; }
        .overview-ring-metric { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; padding: 4px 10px; }
        .overview-ring-metric + .overview-ring-metric { border-left: 1px solid var(--border-card); padding-left: 14px; }
        .overview-ring-metric .ring-text-group { align-items: flex-start; height: auto; }
        .overview-ring-metric .card__label { margin-bottom: 4px; }
        .overview-ring-metric .apple-ring-container { width: 38px; height: 38px; flex-shrink: 0; }

        .cal-header { gap: 8px; }
        .cal-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .display-options { display: grid; gap: 8px; margin-top: 14px; text-align: left; }
        .display-option { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 10px; border-radius: 10px; background: var(--track-bg); color: var(--text-main); font-size: 13px; }
        .display-option input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent-color); }
        .display-select-wrap { display: grid; gap: 7px; margin-top: 14px; text-align: left; color: var(--text-main); font-size: 12px; font-weight: 600; }
        .display-mode-select { width: 100%; padding: 9px 10px; border: 1px solid var(--border-card); border-radius: 9px; background: var(--track-bg); color: var(--text-main); font: inherit; }
        .display-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
        .display-action-btn { min-height: 36px; border: 1px solid var(--border-card); border-radius: 9px; padding: 7px 9px; background: var(--track-bg); color: var(--text-main); font-size: 11px; font-weight: 600; cursor: pointer; }
        [hidden] { display: none !important; }

        .dash-ctrls {
            display: flex; gap: 6px; position: absolute; top: 10px; right: 10px; z-index: 50; 
            opacity: 0; transition: opacity 0.2s ease-in-out; 
        }
        .card:hover .dash-ctrls, .dash-ctrls:hover { opacity: 1; }
        
        .ctrl-btn {
            width: 24px; height: 24px; border-radius: 50%; border: none;
            background: rgba(128,128,128, 0.1); color: var(--text-muted);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 0; transition: transform 0.2s;
        }
        .ctrl-btn:hover { transform: scale(1.1); background: var(--accent-color); color: #fff; }
        .ctrl-btn--color { background-color: var(--bg-swatch) !important; border: 1px solid rgba(0,0,0,0.05); }

        /* --- [核心修改] 顶部区域极致压缩 --- */
        
        /* 1. Clock Card: 压扁，内容紧凑排列 */
        .card--clock { 
            grid-column: 1 / 2; 
            justify-content: center; /* 垂直居中 */
            padding: 16px 20px; /* 极小的内边距 */
            min-height: 90px;   /* 强制压低高度 */
        }
        
        /* 新布局：Flex 左右两端，垂直居中对齐 */
        .clock-group { 
            display: flex; 
            align-items: center; /* [修改] 垂直居中对齐，保证左侧日期组和右侧时间对齐 */
            justify-content: flex-start;
            gap: 12px;
            width: 100%;
        }
        
        .clock-label-group {
            display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 4px;
        }

        /* [修改] 日期样式：加粗、颜色略深，替代原来的 Current Time */
        .card__label { 
            font-size: 11px; /* 稍微大一点 */
            font-weight: 700; 
            color: var(--text-muted); 
            margin: 0; 
            line-height: 1.2;
            white-space: nowrap;
        }
        
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 99px; background: var(--track-bg); color: var(--text-main); font-size: 10px; font-weight: 700; }
        
        /* 数字“挤一挤”：减小 margin */
        .clock-display { 
            font-size: 36px; /* 固定字号防止过大 */
            font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 1; color: var(--text-main); 
            margin-top: 0; /* 移除 margin，靠 flex 居中 */
        }

        /* 2. Main Stat Card: 跟随左侧高度变矮 */
        .card--main { 
            grid-column: 2 / 3; grid-row: 1 / 3; 
            background: var(--accent-color); color: #fff; border: none; 
            justify-content: space-between; overflow: hidden; 
            padding: 16px; /* 减小内边距 */
        }
        
        .main-stat-group { margin-top: auto; padding-bottom: 4px; }
        .main-stat { font-size: 38px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; } /* 字号微调 */
        .card--main .card__label { color: rgba(255,255,255, 0.8); font-size: 9px; }
        
        .hero-bar { height: 8px; background: rgba(0,0,0, 0.2); border-radius: 99px; overflow: hidden; position: relative; margin-top: 0; width: 100%; }
        .hero-bar__fill { height: 100%; width: 0%; background: #fff; border-radius: 99px; transition: width 1s ease; }

        .split-row { grid-column: 1 / 2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); min-width: 0; }
        .card--ring { padding: 8px; align-items: center; justify-content: center; text-align: center; gap: 2px; cursor: default; }
        .ring-text-group { display: flex; flex-direction: column; align-items: center; height: 28px; justify-content: center; }
        .ring-val-pct { display: block; font-size: 14px; font-weight: 700; color: var(--text-main); line-height: 1; }
        .ring-val-days { display: none; font-size: 11px; font-weight: 600; color: var(--accent-color); line-height: 1; }
        .card--ring:hover .ring-val-pct { display: none; }
        .card--ring:hover .ring-val-days { display: block; animation: slideUp 0.2s ease; }
        
        .apple-ring-container { position: relative; width: 40px; height: 40px; }
        .apple-ring-track { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--track-bg); }
        .apple-ring-progress { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--accent-color) var(--deg), transparent 0deg); -webkit-mask: radial-gradient(transparent 60%, black 62%); mask: radial-gradient(transparent 60%, black 62%); opacity: 0; transition: opacity 0.3s; }
        .apple-ring-sphere { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: var(--accent-color); border-radius: 50%; box-shadow: 0 0 2px rgba(0,0,0,0.15); transform: rotate(var(--deg)) translateY(-17.5px); opacity: 0; transition: opacity 0.3s; }

        /* --- Calendar: Accordion / Focus Mode --- */
        .card--calendar { padding-top: 24px; padding-bottom: 16px; /* 底部不需要太多空间了 */ }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; height: 20px; position: relative; }
        .cal-title { flex: 1; min-width: 0; padding-right: 0; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
        
        /* 恢复 SVG 图标 */
        .cal-ctrls { display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
        .card:hover .cal-ctrls, .cal-ctrls:hover { opacity: 1; }

        .calendar-body { display: flex; flex-direction: column; gap: 2px; }
        
        .dow-row { 
            display: grid; grid-template-columns: 32px repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 4px; 
            padding: 0 8px 0 36px; 
            width: 100%; min-width: 0;
        }
        .dow-cell { font-size: 9px; font-weight: 600; color: var(--text-muted); text-align: center; min-width: 0; }
        
        /* [状态1：非本周 - 压缩] */
        .week-row { 
            display: grid; grid-template-columns: 32px repeat(7, minmax(0, 1fr)); gap: 4px; align-items: center; 
            padding: 2px 8px 2px 36px; 
            border-radius: 6px; 
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; 
            opacity: 0.6; 
            filter: grayscale(0.5); 
            width: 100%; min-width: 0;
        }
        
        .day-cell { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            border-radius: 4px; cursor: default; position: relative; transition: all 0.2s;
            aspect-ratio: auto; height: 20px; font-size: 10px; font-weight: 500; min-width: 0;
        }
        /* 压缩行隐藏月份 */
        .day-cell .month-tag { display: none; } 
        .day-cell.past { color: var(--text-dim); }
        .day-cell.future { color: var(--text-main); }

        /* [状态2：本周 - 展开] */
        .week-row.current { 
            /* [修改] 背景色改为浅色主题色，而不是卡片色 */
            background: var(--current-row-bg); 
            padding: 10px 8px 10px 36px; 
            margin: 8px 0; 
            opacity: 1; filter: none;
            box-shadow: none; /* 既然用了主题背景，阴影可以去掉或减淡 */
            transform: scale(1.0); 
            border-radius: 12px;
        }
        
        .week-row.current::before {
            content: ''; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            height: 20px; width: 4px; border-radius: 4px;
            background: var(--accent-color);
            box-shadow: 0 2px 8px rgba(var(--accent-rgb), 0.4);
        }
        
        /* 本周的格子：恢复正方形 */
        .week-row.current .day-cell {
            aspect-ratio: 1/1; height: auto; font-size: 12px; border-radius: 6px;
        }
        /* [核心修复] 本周的格子必须显示月份标签 */
        .week-row.current .day-cell .month-tag { display: block; }
        
        .day-cell.today { background: var(--accent-color); color: #fff; font-weight: 700; box-shadow: 0 3px 8px rgba(var(--accent-rgb), 0.2); z-index: 2; animation: pulse-today 3s infinite ease-in-out; }
        .month-tag { font-size: 7px; line-height: 1; font-weight: 700; margin-bottom: 1px; text-transform: uppercase; }
        
        .week-row.week-13 { margin-top: 8px; border: 1px dashed var(--accent-color); opacity: 0.8; }
        
        .phase-divider { height: 1px; background: repeating-linear-gradient(to right, var(--border-card) 0, var(--border-card) 4px, transparent 4px, transparent 8px); margin: 4px 12px; border-radius: 1px; }
        
        .week-label { font-size: 9px; font-weight: 700; color: var(--text-muted); opacity: 0.5; }
        .week-row.current .week-label { color: var(--accent-color); opacity: 1; font-size: 11px; }
        
        /* [修改] 移除了底部的进度条 (.cal-footer-progress) */

        .quote-card { text-align: center; padding: 4px 0; margin-top: 4px; }
        .quote-text { font-size: 11px; color: var(--text-muted); font-style: italic; margin: 0; opacity: 0.8; transition: opacity 0.5s; }

        /* Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .modal[aria-hidden="false"] { display: flex; animation: fadeIn 0.2s; }
        .modal__card { background: var(--modal-bg); padding: 24px 20px; border-radius: 20px; width: 300px; max-width: 90vw; box-shadow: var(--modal-shadow); text-align: center; }
        .modal__title { margin: 0 0 6px 0; font-size: 16px; font-weight: 700; color: var(--text-main); }
        .modal__desc { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
        .modal__actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .btn-modal { padding: 8px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: transform 0.1s; }
        .btn-modal:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent-color); color: #fff; }
        .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--track-bg); }
        .modal input[type="date"] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border-card); background: var(--track-bg); color: var(--text-main); font-family: "SF Pro Text", "Inter", sans-serif; font-size: 15px; font-weight: 500; text-align: center; display: block; margin: 0 auto; appearance: none; -webkit-appearance: none; }
        ::-webkit-date-and-time-value { text-align: center; }
        .picker-native-input { width: 100%; height: 36px; border: none; background: none; cursor: pointer; margin-bottom: 12px; }
        .picker-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.1); position: relative; }
        .color-dot.active::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--text-main); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse-today { 0% { transform: scale(1); box-shadow: 0 3px 8px rgba(var(--accent-rgb), 0.2); } 50% { transform: scale(1.05); box-shadow: 0 6px 16px rgba(var(--accent-rgb), 0.4); } 100% { transform: scale(1); box-shadow: 0 3px 8px rgba(var(--accent-rgb), 0.2); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            body { align-items: flex-start; padding: 6px; }
            .widget-container { max-width: none; gap: 8px; }
            .time-overview-card { padding: 12px; gap: 10px; }
            .overview-date-time { gap: 8px; }
            .overview-primary { padding: 12px; }
            .overview-primary-top { gap: 6px; }
            .overview-primary .main-stat { font-size: clamp(15px, 4vw, 18px); }
            .overview-ring-metric { padding: 4px 6px; }
            .overview-ring-metric + .overview-ring-metric { padding-left: 9px; }
            .overview-ring-metric .apple-ring-container { width: 32px; height: 32px; }
            .ring-val-pct { font-size: 13px; }
            .card--calendar { padding: 18px 12px 14px; }
            .cal-header { gap: 6px; }
            .cal-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .dow-row, .week-row {
                grid-template-columns: 28px repeat(7, minmax(0, 1fr));
                gap: 2px;
                padding-left: 32px;
                padding-right: 4px;
            }
            .week-row.current { padding: 8px 4px 8px 32px; margin: 6px 0; }
            .week-row.current::before { left: 8px; height: 18px; width: 3px; }
            .day-cell { font-size: 9px; border-radius: 3px; }
            .week-row.current .day-cell { font-size: 10px; }
            .month-tag { font-size: 6px; margin-bottom: 0; }
            .week-label { font-size: 8px; }
            .week-row.current .week-label { font-size: 9px; }
            .phase-divider { margin: 4px 6px; }
        }

        @media (hover: none) {
            .overview-tools .dash-ctrls { opacity: 1; }
            .overview-tools .btn-display { opacity: 1; pointer-events: auto; }
        }
    </style>
</head>
<body>

<div class="widget-container">
    
    <!-- 1. 时间概览：日期、12周进度、年进度和周进度共享一个组件 -->
    <section class="card time-overview-card" id="time-overview" aria-label="时间概览">
        <div class="overview-top">
            <div id="overview-title" class="overview-title" hidden>时间概览</div>
            <div class="clock-group overview-date-time" id="metric-datetime">
                <div class="clock-label-group">
                    <div id="date-display" class="card__label">Loading...</div>
                    <div id="week-badge" class="badge">W1</div>
                </div>
                <div id="clock" class="clock-display">00:00</div>
            </div>
            <div class="overview-tools">
                <button id="btn-display" class="ctrl-btn btn-display" title="自定义显示" aria-label="自定义显示">
                    <svg class="icon-svg" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="17" r="2"/></svg>
                </button>
            </div>
        </div>

        <div class="overview-primary" id="metric-12w">
            <div class="overview-primary-top">
                <div class="overview-primary-info">
                    <div class="card__label">12 Week Year</div>
                    <div class="card__label" style="margin: 0;">第 <span id="weeks-12w-num">1</span>/12 周 · 剩 <span id="days-12w-left">0</span> 天</div>
                </div>
                <div class="main-stat" id="pct-12w">0%</div>
            </div>
            <div class="hero-bar"><div id="bar-12w" class="hero-bar__fill"></div></div>
        </div>

        <div class="overview-secondary" aria-label="其他时间进度">
            <div class="overview-ring-metric" id="metric-year">
                <div class="ring-text-group">
                    <div class="card__label">Year</div>
                    <div class="ring-val-pct" id="txt-year">0%</div>
                    <div class="ring-val-days" id="days-year">剩0天</div>
                </div>
                <div class="apple-ring-container">
                    <div class="apple-ring-track"></div>
                    <div class="apple-ring-progress" id="ring-progress-year"></div>
                    <div class="apple-ring-sphere" id="ring-sphere-year"></div>
                </div>
            </div>
            <div class="overview-ring-metric" id="metric-week">
                <div class="ring-text-group">
                    <div class="card__label">Week</div>
                    <div class="ring-val-pct" id="txt-week">0%</div>
                    <div class="ring-val-days" id="days-week">剩0天</div>
                </div>
                <div class="apple-ring-container">
                    <div class="apple-ring-track"></div>
                    <div class="apple-ring-progress" id="ring-progress-week"></div>
                    <div class="apple-ring-sphere" id="ring-sphere-week"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 2. 底部：日历 (无进度条版) -->
    <div class="card card--calendar" id="calendar-card">
        <div class="cal-header">
            <div class="cal-title" id="date-range-label">12 Week View</div>
        </div>
        <div class="dow-row">
            <div></div> <!-- Corner -->
            <div class="dow-cell">周一</div><div class="dow-cell">周二</div><div class="dow-cell">周三</div><div class="dow-cell">周四</div><div class="dow-cell">周五</div><div class="dow-cell">周六</div><div class="dow-cell">周日</div>
        </div>
        <div class="calendar-body" id="cal-body"></div>
    </div>

    <!-- 3. 引言 -->
    <footer class="quote-card" id="quote-card">
        <p id="quote-text" class="quote-text">Loading...</p>
    </footer>
</div>

<!-- Modals (共用) -->
<div id="modal-date" class="modal" aria-hidden="true">
    <div class="modal__card">
        <h3 class="modal__title">设置开始日期</h3>
        <p class="modal__desc">选择开始时间<br>(保存后自动修正为当周周一)</p>
        <input type="date" id="input-date">
        <div class="modal__actions">
            <button class="btn-modal btn-ghost" id="cancel-date">取消</button>
            <button class="btn-modal btn-primary" id="save-date">确认</button>
        </div>
    </div>
</div>
<div id="modal-primary" class="modal" aria-hidden="true">
    <div class="modal__card">
        <h3 class="modal__title">选择主色</h3>
        <input type="color" id="native-primary" class="picker-native-input" value="#ff2d55">
        <div class="picker-grid" id="grid-primary"></div>
        <div class="modal__actions">
            <button class="btn-modal btn-ghost" id="cancel-primary">取消</button>
            <button class="btn-modal btn-primary" id="save-primary">确认</button>
        </div>
    </div>
</div>
<div id="modal-bg" class="modal" aria-hidden="true">
    <div class="modal__card">
        <h3 class="modal__title">选择背景色</h3>
        <input type="color" id="native-bg" class="picker-native-input" value="#ffffff">
        <div class="picker-grid" id="grid-bg"></div>
        <div class="modal__actions">
            <button class="btn-modal btn-ghost" id="cancel-bg">取消</button>
            <button class="btn-modal btn-primary" id="save-bg">确认</button>
        </div>
    </div>
</div>
<div id="modal-display" class="modal" aria-hidden="true">
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="display-modal-title">
        <h3 class="modal__title" id="display-modal-title">自定义显示</h3>
        <p class="modal__desc">选择时间概览中要显示的内容</p>
        <div class="display-options">
            <label class="display-option" for="display-datetime"><span>日期、时钟与当前周</span><input id="display-datetime" type="checkbox"></label>
            <label class="display-option" for="display-progress-12w"><span>12 周周期进度</span><input id="display-progress-12w" type="checkbox"></label>
            <label class="display-option" for="display-year"><span>年度进度</span><input id="display-year" type="checkbox"></label>
            <label class="display-option" for="display-week"><span>本周进度</span><input id="display-week" type="checkbox"></label>
            <label class="display-option" for="display-quote"><span>底部语录</span><input id="display-quote" type="checkbox"></label>
        </div>
        <label class="display-select-wrap" for="display-calendar-mode">
            12 周日历
            <select id="display-calendar-mode" class="display-mode-select">
                <option value="compact">精简：当前周前后各一周</option>
                <option value="full">完整：12 周 + R 回顾周</option>
                <option value="hidden">隐藏日历</option>
            </select>
        </label>
        <div class="display-actions" aria-label="其他设置">
            <button id="btn-12w" class="display-action-btn" type="button">设置周期起始日</button>
            <button id="btn-theme" class="display-action-btn" type="button">切换明暗主题</button>
            <button id="btn-primary" class="display-action-btn" type="button">更改主色</button>
            <button id="btn-bg" class="display-action-btn" type="button">更改背景色</button>
        </div>
        <div class="modal__actions">
            <button class="btn-modal btn-ghost" id="cancel-display">取消</button>
            <button class="btn-modal btn-primary" id="save-display">保存</button>
        </div>
    </div>
</div>

<script>
// --- Utils ---
const LS = { get: (k,d)=> { try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;} }, set: (k,v)=> { try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} } };
const DEFAULT_DISPLAY_PREFS = { dateTime: true, progress12w: true, year: true, week: true, quote: true };
let displayPrefs = { ...DEFAULT_DISPLAY_PREFS, ...LS.get('displayPrefs', {}) };
let calendarMode = LS.get('calendarMode', 'compact');
if (!['compact', 'full', 'hidden'].includes(calendarMode)) calendarMode = 'compact';
function two(n){return String(n).padStart(2,'0')}
function getMonday(d){ d=new Date(d); const day=d.getDay(); const diff=d.getDate()-day+(day===0?-6:1); return new Date(d.setDate(diff)); }
function formatDate(d){ return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`; }
function hexToRgb(hex){ const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); return r?`${parseInt(r[1],16)}, ${parseInt(r[2],16)}, ${parseInt(r[3],16)}`:'10, 132, 255'; }

// --- Safe Click Helper ---
const safeClick = (id, fn) => {
    const el = document.getElementById(id);
    if(el) el.onclick = fn;
};

function applyDisplayPreferences() {
    const setVisible = (id, visible) => {
        const el = document.getElementById(id);
        if (el) el.hidden = !visible;
    };
    setVisible('metric-datetime', displayPrefs.dateTime);
    setVisible('metric-12w', displayPrefs.progress12w);
    setVisible('metric-year', displayPrefs.year);
    setVisible('metric-week', displayPrefs.week);
    setVisible('overview-title', !displayPrefs.dateTime);
    setVisible('quote-card', displayPrefs.quote);
    setVisible('calendar-card', calendarMode !== 'hidden');
}

function syncDisplaySettingsForm() {
    const checkboxValues = {
        'display-datetime': displayPrefs.dateTime,
        'display-progress-12w': displayPrefs.progress12w,
        'display-year': displayPrefs.year,
        'display-week': displayPrefs.week,
        'display-quote': displayPrefs.quote
    };
    for (const [id, checked] of Object.entries(checkboxValues)) {
        const input = document.getElementById(id);
        if (input) input.checked = checked;
    }
    const select = document.getElementById('display-calendar-mode');
    if (select) select.value = calendarMode;
}

function renderCalendar(startDate, now, currentWeek) {
    const container = document.getElementById('cal-body');
    if (!container) return;
    container.innerHTML = '';
    const todayStr = formatDate(now);
    const focusWeek = Math.min(12, Math.max(1, currentWeek));
    const compactStart = Math.min(10, Math.max(1, focusWeek - 1));
    const visibleWeeks = calendarMode === 'full'
        ? Array.from({ length: 13 }, (_, index) => index + 1)
        : [compactStart, compactStart + 1, compactStart + 2];

    for (const weekNum of visibleWeeks) {
        const row = document.createElement('div');
        row.className = 'week-row';
        if (weekNum === 13) row.classList.add('week-13');

        const weekLabel = document.createElement('div');
        weekLabel.className = 'week-label';
        weekLabel.textContent = weekNum === 13 ? 'R' : `W${weekNum}`;
        row.appendChild(weekLabel);

        const daysContainer = document.createElement('div');
        daysContainer.className = 'week-days-container';
        daysContainer.style.display = 'contents';
        let isCurrentRow = false;

        for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            const dateObj = new Date(startDate);
            dateObj.setDate(dateObj.getDate() + ((weekNum - 1) * 7) + dayOffset);
            const cellDateStr = formatDate(dateObj);
            cell.title = dateObj.toLocaleDateString();

            if (dateObj.getDate() === 1) {
                const monthTag = document.createElement('span');
                monthTag.className = 'month-tag';
                monthTag.textContent = dateObj.toLocaleString('en-US', { month: 'short' });
                cell.appendChild(monthTag);
            }
            const dayNumber = document.createElement('span');
            dayNumber.textContent = dateObj.getDate();
            cell.appendChild(dayNumber);

            if (cellDateStr === todayStr) { cell.classList.add('today'); isCurrentRow = true; }
            else if (dateObj < now) cell.classList.add('past');
            else cell.classList.add('future');
            daysContainer.appendChild(cell);
        }

        row.appendChild(daysContainer);
        if (isCurrentRow) row.classList.add('current');
        container.appendChild(row);
        if (calendarMode === 'full' && (weekNum === 4 || weekNum === 8)) {
            const divider = document.createElement('div');
            divider.className = 'phase-divider';
            container.appendChild(divider);
        }
    }

    const endDate = new Date(startDate);
    endDate.setDate(endDate.getDate() + 83);
    document.getElementById('date-range-label').textContent = `${startDate.getFullYear()}.${two(startDate.getMonth()+1)}.${two(startDate.getDate())} - ${endDate.getFullYear()}.${two(endDate.getMonth()+1)}.${two(endDate.getDate())}`;
}

// --- Logic ---
function updateAll(startDate) {
    const now = new Date();
    // Dashboard Logic
    document.getElementById('clock').textContent = `${two(now.getHours())}:${two(now.getMinutes())}`;
    
    // [新增] 更新日期显示
    const dateStr = now.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', weekday: 'short' });
    document.getElementById('date-display').textContent = dateStr;

    const s = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
    const e = new Date(s); e.setDate(s.getDate()+84);
    const passed = now-s;
    const totalMs = e-s;
    let pct12 = Math.max(0, Math.min(1, passed/totalMs))*100;
    
    const currentWeekNum = Math.ceil(passed/(7*86400000));
    const safeWeekNum = Math.max(1, currentWeekNum);
    document.getElementById('week-badge').textContent = `W${safeWeekNum}`;
    document.getElementById('pct-12w').textContent = `${pct12.toFixed(1)}%`;
    document.getElementById('bar-12w').style.width = `${pct12}%`;
    document.getElementById('weeks-12w-num').textContent = safeWeekNum;
    document.getElementById('days-12w-left').textContent = Math.max(0, Math.ceil((e-now)/86400000));

    const updateRing = (pid, sid, p) => {
        const deg = (p/100)*360;
        const pel=document.getElementById(pid), sel=document.getElementById(sid);
        if(pel && sel) {
            pel.style.setProperty('--deg', `${deg}deg`); sel.style.setProperty('--deg', `${deg}deg`);
            pel.style.opacity = p>0?1:0; sel.style.opacity = p>0?1:0;
        }
    };
    const yS = new Date(now.getFullYear(),0,1), yE = new Date(now.getFullYear()+1,0,1);
    const yPct = Math.max(0, Math.min(100, ((now-yS)/(yE-yS))*100));
    updateRing('ring-progress-year', 'ring-sphere-year', yPct);
    document.getElementById('txt-year').textContent = `${yPct.toFixed(0)}%`;
    document.getElementById('days-year').textContent = `剩${Math.ceil((yE-now)/86400000)}天`;

    const d = (now.getDay()+6)%7;
    const wS = new Date(now); wS.setHours(0,0,0,0); wS.setDate(now.getDate()-d);
    const wE = new Date(wS); wE.setDate(wS.getDate()+7);
    const wPct = Math.max(0, Math.min(100, ((now-wS)/(7*86400000))*100));
    updateRing('ring-progress-week', 'ring-sphere-week', wPct);
    document.getElementById('txt-week').textContent = `${wPct.toFixed(0)}%`;
    document.getElementById('days-week').textContent = `剩${Math.max(0, Math.ceil((wE-now)/86400000))}天`;

    renderCalendar(startDate, now, safeWeekNum);
    
    // Quotes Logic
    updateQuote(safeWeekNum);
}

// 阶段性语录库 (Restored)
const QUOTES_DB = {
    start: [ // W1-W4
        '开始是成功的一半', '唯有行动能治愈恐惧', '种一棵树最好的时间是十年前，其次是现在', '不要等待机会，而要创造机会', '万事开头难，但你已经上路了'
    ],
    mid: [ // W5-W8
        '坚持就是胜利', '伟大的作品不是靠力量，而是靠坚持来完成的', '在黎明前总是最黑暗的', '不要假装努力，结果不会陪你演戏', '平凡的脚步也可以走完伟大的行程'
    ],
    end: [ // W9-13
        '行百里者半九十', '专注于当下，结果自然会来', '最后冲刺，不留遗憾', '终点线就在眼前', '你只活一次，使它有意义', '现在放弃，之前的努力就白费了'
    ]
};
let quoteIndex = 0;

function updateQuote(currentWeek) {
    const qEl = document.getElementById('quote-text');
    if (!qEl) return;

    let targetArray = QUOTES_DB.start;
    if (currentWeek >= 5 && currentWeek <= 8) targetArray = QUOTES_DB.mid;
    if (currentWeek >= 9) targetArray = QUOTES_DB.end;

    if (!window.quoteTimer) {
        const rotate = () => {
            qEl.style.opacity = 0;
            setTimeout(() => {
                quoteIndex = (quoteIndex + 1) % targetArray.length;
                qEl.textContent = targetArray[quoteIndex];
                qEl.style.opacity = 0.8;
            }, 500);
        };
        qEl.textContent = targetArray[0];
        window.quoteTimer = setInterval(rotate, 8000);
    }
}

// Color Theme Logic (Restored)
const COLORS = ['#ff2d55', '#ff9500', '#ffcc00', '#4cd964', '#5ac8fa', '#007aff', '#5856d6', '#ff3b30', '#8e8e93', '#333333'];
const BG_COLORS = ['transparent', '#ffffff', '#f2f2f7', '#e5e5e5', '#000000', '#1c1c1e', '#2c2c2e'];

function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    const p = LS.get(`primary:${t}`, '#ff2d55');
    document.documentElement.style.setProperty('--accent-color', p);
    document.documentElement.style.setProperty('--accent-rgb', hexToRgb(p));
    document.querySelectorAll('[id*="btn-primary"]').forEach(btn => btn.style.setProperty('--bg-swatch', p));
    
    const bg = LS.get(`bg:${t}`, 'transparent');
    document.documentElement.style.setProperty('--bg-page', bg);
    document.querySelectorAll('[id*="btn-bg"]').forEach(btn => btn.style.setProperty('--bg-swatch', bg));
}

window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    let startStr = urlParams.get('start') || LS.get('start12w', null);
    if(!startStr) startStr = formatDate(getMonday(new Date())); 
    let startDate = getMonday(new Date(startStr)); 
    
    const theme = LS.get('theme', 'light');
    applyTheme(theme);
    applyDisplayPreferences();
    
    updateAll(startDate);
    setInterval(() => updateAll(startDate), 1000);

    const openM = (id) => document.getElementById(id).setAttribute('aria-hidden', 'false');
    const closeM = (id) => document.getElementById(id).setAttribute('aria-hidden', 'true');

    safeClick('btn-display', () => { syncDisplaySettingsForm(); openM('modal-display'); });
    safeClick('cancel-display', () => closeM('modal-display'));
    safeClick('save-display', () => {
        displayPrefs = {
            dateTime: document.getElementById('display-datetime').checked,
            progress12w: document.getElementById('display-progress-12w').checked,
            year: document.getElementById('display-year').checked,
            week: document.getElementById('display-week').checked,
            quote: document.getElementById('display-quote').checked
        };
        calendarMode = document.getElementById('display-calendar-mode').value;
        LS.set('displayPrefs', displayPrefs);
        LS.set('calendarMode', calendarMode);
        applyDisplayPreferences();
        updateAll(startDate);
        closeM('modal-display');
    });
    // Bind Modals to BOTH sets of buttons (Dash + Cal)
    const bindBtns = (ids, handler) => ids.forEach(id => safeClick(id, handler));

    bindBtns(['btn-12w'], () => { 
        document.getElementById('input-date').value = formatDate(startDate);
        closeM('modal-display');
        openM('modal-date'); 
    });
    safeClick('save-date', () => { 
        startDate = getMonday(new Date(document.getElementById('input-date').value));
        LS.set('start12w', formatDate(startDate)); updateAll(startDate); closeM('modal-date'); 
    });
    safeClick('cancel-date', () => closeM('modal-date'));

    const setupPicker = (btnIds, modalId, inputId, gridId, keyPrefix, colors) => {
        btnIds.forEach(id => {
            safeClick(id, () => {
                const t = document.documentElement.getAttribute('data-theme');
                const cur = LS.get(`${keyPrefix}:${t}`, colors[0]);
                document.getElementById(inputId).value = cur==='transparent'?'#ffffff':cur;
                const gridEl = document.getElementById(gridId); gridEl.innerHTML='';
                colors.forEach(c => {
                    const d = document.createElement('div'); d.className='color-dot'; d.style.background=c;
                    if(c==='transparent') d.style.border='1px solid #ccc';
                    d.onclick = () => { if(c!=='transparent') document.getElementById(inputId).value = c; };
                    gridEl.appendChild(d);
                });
                closeM('modal-display');
                openM(modalId);
            });
        });
    };

    setupPicker(['btn-primary'], 'modal-primary', 'native-primary', 'grid-primary', 'primary', COLORS);
    safeClick('save-primary', () => {
        const val = document.getElementById('native-primary').value; const t = document.documentElement.getAttribute('data-theme');
        LS.set(`primary:${t}`, val); applyTheme(t); closeM('modal-primary');
    });
    safeClick('cancel-primary', () => closeM('modal-primary'));

    setupPicker(['btn-bg'], 'modal-bg', 'native-bg', 'grid-bg', 'bg', BG_COLORS);
    safeClick('save-bg', () => {
        const val = document.getElementById('native-bg').value; const t = document.documentElement.getAttribute('data-theme');
        LS.set(`bg:${t}`, val); applyTheme(t); closeM('modal-bg');
    });
    safeClick('cancel-bg', () => closeM('modal-bg'));

    const toggleTheme = () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur==='light'?'dark':'light';
        LS.set('theme', next); applyTheme(next);
    };
    bindBtns(['btn-theme'], toggleTheme);
});
</script>
